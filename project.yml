name: Scorebook
options:
  bundleIdPrefix: com.frockenstein
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  Scorebook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Scorebook
    info:
      path: Scorebook/Info.plist
      properties:
        CFBundleDisplayName: Scorebook
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.frockenstein.scorebook
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: EBUBW4Q4F8
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  ScorebookTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ScorebookTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Scorebook
